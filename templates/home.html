<!DOCTYPE html>
<head>
    <title>Home</title>
    <style>
body{
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
}

/* NAV BAR */
.navBar{
    background-color: #2c3e50;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

/* MESSAGE AREA */
.messagesContainer{
    padding: 20px;
    height: 60vh;
    overflow-y: auto;
}

/* SINGLE MESSAGE */
.message{
    background-color: white;
    padding: 12px 16px;
    margin-bottom: 10px;
    border-radius: 10px;
    max-width: 60%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.message p{
    margin: 0;
}

/* USERNAME */
.username{
    font-weight: bold;
    margin-bottom: 5px;
    color: #2c3e50;
}

/* SEND MESSAGE BAR */
.sendMessage{
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    padding: 10px;
    background-color: white;
    border-top: 1px solid #ddd;
}

.sendMessage input[name="post"]{
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid #ccc;
    outline: none;
}

.sendMessage input[name="post"]:focus{
    border-color: #3498db;
}

/* BUTTON */
.sendMessage button{
    margin-left: 10px;
    padding: 10px 20px;
    border: none;
    background-color: #3498db;
    color: white;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.sendMessage button:hover{
    background-color: #2980b9;
}
</style>
</head>

    </div>

</body>
