<!DOCTYPE html>
<head>
<title></title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #4a90e2, #6dd5ed);
    height: 100vh;
}

/* Navbar */
.navbar {
    width: 100%;
    background: #1f2a44;
    color: white;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 18px;
    position: fixed;
    top: 0;
    left: 0;
}

/* Error Box */
.errorBox {
    margin-top: 80px;
    text-align: center;
    color: #b00020;
    background: #ffe5e5;
    border: 1px solid #ffb3b3;
    padding: 10px;
    width: 300px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 8px;
    display: none;
}

.errorBox h1 {
    font-size: 16px;
    margin: 0;
}

.errorBox p {
    margin: 5px 0 0;
    font-size: 14px;
}

/* Card */
.card {
    background: white;
    width: 320px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
}

.card p {
    font-size: 18px;
    margin-bottom: 15px;
    font-weight: bold;
}

.card h1 {
    margin-bottom: 10px;
}

/* Inputs */
.card input {
    width: 90%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
}

/* Button */
.card button {
    width: 95%;
    padding: 10px;
    margin-top: 10px;
    background: #4a90e2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.card button:hover {
    background: #357abd;
}
</style>
</head>
<body>
<div class="navbar">
<P>AGE FILTER</P>
</div>
<div class="errorBox" id="errorBox">
    <h1>THIS USERNAME IS TAKEN</h1>
</div>
<br>
<br>
<br>
<br>
<br>
<br>
<br>
<br>    
<div class="card">
<p>Signup</p>

<form method="POST" action="/signup">
    <input name="username" id="username">
    <input name="password">
    <button type="submit">Signup</button>
</form>
</div>
<script>
var data = {}
async function check(){
    const response = await fetch("/signupData");
    data = await response.json();
    if (document.getElementById("username") in data.takenUsers){
        document.getElementById("errorBox").style.display = "block";
    } 
    else{
     document.getElementById("errorBox").style.display = "none";
    }
}
</script>

</body>
